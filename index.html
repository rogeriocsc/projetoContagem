<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Projeto Contagem</title>
</head>
<body>
    <main>
        <section class="projeto-contagem">
            <h2>Projeto Contagem</h2>
            <div class="elementos">
                <div class="campos">
                    <label for="i_inic">Início</label>
                    <input type="number" name="inicio" id="i_inic" placeholder="Informe o Valor Inicial">

                    <label for="i_fim">Fim</label>
                    <input type="number" name="fim" id="i_fim" placeholder="Informe o Valor Final">

                    <label for="i_passo">Passo</label>
                    <input type="number" name="passo" id="i_passo" placeholder="Informe o Passo">
                </div>
                <button onclick="contar()">Contar</button>
            </div>
        </section>
        <div class="res" id="resp">
            <p>Contando...</p>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
